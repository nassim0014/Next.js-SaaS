title = "gitleaks config"

# Extends the default gitleaks ruleset (all standard rules stay active) and
# adds an allowlist for reviewed-and-confirmed false positives, so we don't
# have to rewrite git history every time a test fixture happens to look
# high-entropy to the generic-api-key heuristic.
[extend]
useDefault = true

[allowlist]
description = "Reviewed false positives — test fixtures, not real secrets"
fingerprints = [
  # A hardcoded fake HMAC secret in a unit test for lib/webhooks/signer.ts
  # (src/lib/webhooks/signer.test.ts:5) — "test-signing-secret-abc123" is
  # not a real credential, just happens to have enough entropy to trip
  # the generic-api-key rule.
  "2763a52927ce3d3ace46a9ec9d47096852809dc7:src/lib/webhooks/signer.test.ts:generic-api-key:5",
]
